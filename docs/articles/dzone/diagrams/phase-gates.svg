<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="396" viewBox="0 0 1490 396" font-family="Helvetica, Arial, sans-serif">
  <!-- Source for phase-gates.png and phase-gates.jpg: rsvg-convert -z 2 -b white phase-gates.svg -o phase-gates.png -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1490" height="396" fill="#ffffff"/>
  <rect x="30" y="30" width="230" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="145.0" y="62.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">0. Discover</text>
  <text x="145.0" y="84.0" text-anchor="middle" font-size="15" fill="#0f172a">contexts, CDC feasibility,</text>
  <text x="145.0" y="106.0" text-anchor="middle" font-size="15" fill="#0f172a">baseline MIPS</text>
  <rect x="430" y="30" width="230" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="545.0" y="62.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">1. Encapsulate</text>
  <text x="545.0" y="84.0" text-anchor="middle" font-size="15" fill="#0f172a">ACL + pass-through facade,</text>
  <text x="545.0" y="106.0" text-anchor="middle" font-size="15" fill="#0f172a">correlation IDs</text>
  <rect x="830" y="30" width="230" height="96" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="945.0" y="62.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">2. Build read side</text>
  <text x="945.0" y="84.0" text-anchor="middle" font-size="15" fill="#0f172a">CDC, read model,</text>
  <text x="945.0" y="106.0" text-anchor="middle" font-size="15" fill="#0f172a">lag SLO + fallback</text>
  <rect x="1230" y="30" width="230" height="96" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="1345.0" y="62.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">3. Prove</text>
  <text x="1345.0" y="84.0" text-anchor="middle" font-size="15" fill="#0f172a">parallel run,</text>
  <text x="1345.0" y="106.0" text-anchor="middle" font-size="15" fill="#0f172a">discrepancy triage</text>
  <rect x="30" y="270" width="230" height="96" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="145.0" y="302.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">4. Shift reads</text>
  <text x="145.0" y="324.0" text-anchor="middle" font-size="15" fill="#0f172a">canary to 100%,</text>
  <text x="145.0" y="346.0" text-anchor="middle" font-size="15" fill="#0f172a">legacy fallback kept</text>
  <rect x="430" y="270" width="230" height="96" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="545.0" y="302.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">5. Extend</text>
  <text x="545.0" y="324.0" text-anchor="middle" font-size="15" fill="#0f172a">outbox, events,</text>
  <text x="545.0" y="346.0" text-anchor="middle" font-size="15" fill="#0f172a">branch by abstraction</text>
  <rect x="830" y="270" width="230" height="96" rx="6" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="945.0" y="302.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">6. Decommission</text>
  <text x="945.0" y="324.0" text-anchor="middle" font-size="15" fill="#ffffff">remove legacy path</text>
  <text x="945.0" y="346.0" text-anchor="middle" font-size="15" fill="#ffffff">and scaffolding</text>
  <line x1="260" y1="78.0" x2="428" y2="78.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="345.0" y="70.0" text-anchor="middle" font-size="14" fill="#334155">capability selected</text>
  <text x="345.0" y="52.0" text-anchor="middle" font-size="14" fill="#334155">gate: first</text>
  <line x1="660" y1="78.0" x2="828" y2="78.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="745.0" y="70.0" text-anchor="middle" font-size="14" fill="#334155">change</text>
  <text x="745.0" y="52.0" text-anchor="middle" font-size="14" fill="#334155">facade, no behavior</text>
  <text x="745.0" y="34.0" text-anchor="middle" font-size="14" fill="#334155">gate: all traffic via</text>
  <line x1="1060" y1="78.0" x2="1228" y2="78.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1145.0" y="70.0" text-anchor="middle" font-size="14" fill="#334155">month-end</text>
  <text x="1145.0" y="52.0" text-anchor="middle" font-size="14" fill="#334155">N days incl.</text>
  <text x="1145.0" y="34.0" text-anchor="middle" font-size="14" fill="#334155">gate: reconciles over</text>
  <line x1="260" y1="318.0" x2="428" y2="318.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="345.0" y="310.0" text-anchor="middle" font-size="14" fill="#334155">rollback tested</text>
  <text x="345.0" y="292.0" text-anchor="middle" font-size="14" fill="#334155">gate: SLOs hold,</text>
  <line x1="660" y1="318.0" x2="828" y2="318.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="745.0" y="310.0" text-anchor="middle" font-size="14" fill="#334155">cutover</text>
  <text x="745.0" y="292.0" text-anchor="middle" font-size="14" fill="#334155">shadow, canary,</text>
  <text x="745.0" y="274.0" text-anchor="middle" font-size="14" fill="#334155">gate: each replacement</text>
  <line x1="1060" y1="318.0" x2="1228" y2="318.0" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1145.0" y="310.0" text-anchor="middle" font-size="14" fill="#334155">evidence filed, sign-off</text>
  <text x="1145.0" y="292.0" text-anchor="middle" font-size="14" fill="#334155">gate: books balance,</text>
  <rect x="1230" y="292.0" width="230" height="52" rx="26" fill="#1e293b" stroke="#1e293b" stroke-width="2"/>
  <text x="1345.0" y="324.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Capability done</text>
  <path d="M1345.0,126 V198.0 H145.0 V268" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="745.0" y="190.0" text-anchor="middle" font-size="14" fill="#334155">gate after 3: mismatches below threshold, differences signed off</text>
</svg>
