<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif">
  <!-- Source for modernization-phases.png: rsvg-convert -z 2 -b white modernization-phases.svg -o modernization-phases.png -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
  <rect width="1200" height="300" fill="#ffffff"/>
  <rect x="30" y="20" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="157.5" y="58" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">0. Discover</text>
  <text x="157.5" y="86" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">pick one capability</text>
  <rect x="325" y="20" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="452.5" y="58" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">1. Encapsulate</text>
  <text x="452.5" y="86" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">facade as pass-through</text>
  <rect x="620" y="20" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="747.5" y="58" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">2. Build read side</text>
  <text x="747.5" y="86" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">reconciles within tolerance</text>
  <rect x="915" y="20" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="1042.5" y="58" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">3. Prove</text>
  <text x="1042.5" y="86" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">differences signed off</text>
  <rect x="30" y="190" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="157.5" y="228" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">4. Shift reads</text>
  <text x="157.5" y="256" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">rollback tested</text>
  <rect x="325" y="190" width="255" height="90" rx="6" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="452.5" y="228" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">5. Extend</text>
  <text x="452.5" y="256" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">shadow, canary, cutover</text>
  <rect x="620" y="190" width="255" height="90" rx="6" fill="#fdf2e9" stroke="#c05621" stroke-width="2"/>
  <text x="747.5" y="228" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a202c">6. Decommission</text>
  <text x="747.5" y="256" text-anchor="middle" font-size="18" font-style="italic" fill="#2d3748">books balance, sign-off</text>
  <line x1="285" y1="65.0" x2="323" y2="65.0" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <line x1="580" y1="65.0" x2="618" y2="65.0" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <line x1="875" y1="65.0" x2="913" y2="65.0" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <line x1="285" y1="235.0" x2="323" y2="235.0" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <line x1="580" y1="235.0" x2="618" y2="235.0" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1042.5,110 V150 H157.5 V188" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
