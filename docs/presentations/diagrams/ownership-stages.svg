<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="360" fill="#ffffff"/>
  <rect x="40" y="60" width="330" height="170" rx="16" fill="#0f1b3d" stroke="#0f1b3d" stroke-width="2.5" filter="url(#s)"/>
  <text x="58" y="88" font-size="15" font-weight="700" letter-spacing="1.5" fill="#a5b4fc">STAGE 1</text>
  <text x="205.0" y="149.0" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Legacy writes</text>
  <text x="205.0" y="179.0" text-anchor="middle" font-size="19" fill="#a5b4fc">new = CDC read copy</text>
  <rect x="430" y="60" width="330" height="170" rx="16" fill="#0f1b3d" stroke="#0f1b3d" stroke-width="2.5" filter="url(#s)"/>
  <text x="448" y="88" font-size="15" font-weight="700" letter-spacing="1.5" fill="#a5b4fc">STAGE 2</text>
  <text x="595.0" y="149.0" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Legacy writes</text>
  <text x="595.0" y="179.0" text-anchor="middle" font-size="19" fill="#a5b4fc">new computes in shadow</text>
  <path d="M374,145 L426,145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="400" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#6366f1">GATE</text>
  <rect x="820" y="60" width="330" height="170" rx="16" fill="#ecfdf9" stroke="#14b8a6" stroke-width="2.5" filter="url(#s)"/>
  <text x="838" y="88" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0f766e">STAGE 3</text>
  <text x="985.0" y="149.0" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3b36">New writes</text>
  <text x="985.0" y="179.0" text-anchor="middle" font-size="19" fill="#0f766e">legacy = reverse-sync copy</text>
  <path d="M764,145 L816,145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="790" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#6366f1">GATE</text>
  <rect x="1210" y="60" width="330" height="170" rx="16" fill="#ecfdf9" stroke="#14b8a6" stroke-width="2.5" filter="url(#s)"/>
  <text x="1228" y="88" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0f766e">STAGE 4</text>
  <text x="1375.0" y="139.0" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3b36">New writes</text>
  <text x="1375.0" y="169.0" text-anchor="middle" font-size="19" fill="#0f766e">legacy consumers moved,</text>
  <text x="1375.0" y="194.0" text-anchor="middle" font-size="19" fill="#0f766e">sync and legacy retired</text>
  <path d="M1154,145 L1206,145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1180" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#6366f1">GATE</text>
  <path d="M985,230 L985,300 L595,300 L595,234" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#aw)"/>
  <text x="790" y="330" text-anchor="middle" font-size="18" font-style="italic" fill="#d97706">rollback: ownership returns to legacy</text>
</svg>
